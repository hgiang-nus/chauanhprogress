name: Rebuild dashboard data

on:
  push:
    paths: ["logs/**", "build.py", "sources.json", "curriculum_map.json", "observations.json"]
  schedule:
    - cron: "0 0 * * 1"   # Monday 08:00 Asia/Singapore
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python3 build.py
      - name: Commit generated data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Rebuild dashboard data"
          git push
